<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #14121f; color: #f3f0fb; font-family: system-ui, sans-serif;
    display: grid; place-content: center; text-align: center; gap: 0.5rem;
  }
  h1 { font-size: 8vmin; margin: 0 1rem; }
  p { margin: 0 1rem; opacity: 0.55; }
</style>
</head>
<body>
<h1>{{name}}</h1>
<p>Nothing here yet. Ask a helper what to build.</p>
<!-- Every library the game holds. The input module used to be left out of
     this page, because on a phone it drew a stick and buttons over these two
     lines; now the shape is a choice somebody makes when the game is made,
     and a game whose choice was "just the game's own buttons" draws nothing.
     config/controls.js comes first: it is what input.js reads. -->
<script src="config/controls.js"></script>
<script src="studio/input.js"></script>
<script src="studio/state.js"></script>
<script src="studio/sound.js"></script>
<script src="studio/sprites.js"></script>
<script src="studio/screens.js"></script>
<script src="studio/moments.js"></script>
<script src="config/achievements.js"></script>
<script src="studio/achievements.js"></script>
</body>
</html>
