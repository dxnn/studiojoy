<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #14121f; color: #f3f0fb; font-family: system-ui, sans-serif;
    display: grid; place-content: center; text-align: center; gap: 0.5rem;
  }
  h1 { font-size: 8vmin; margin: 0 1rem; }
  p { margin: 0 1rem; opacity: 0.55; }
</style>
</head>
<body>
<h1>{{name}}</h1>
<p>Nothing here yet. Ask a helper what to build.</p>
<!-- Every library the game holds but the input module: a plain page has
     nothing to steer, and on a phone input.js would draw a stick and buttons
     over these two lines. A game that grows controls adds the two tags —
     config/controls.js, then studio/input.js — where the helper is told to. -->
<script src="studio/sound.js"></script>
<script src="studio/sprites.js"></script>
<script src="studio/screens.js"></script>
<script src="studio/moments.js"></script>
<script src="config/achievements.js"></script>
<script src="studio/achievements.js"></script>
</body>
</html>
